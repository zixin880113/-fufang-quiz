<style>
/* Layout: single-column drill card (one question at a time), collapsible question map, sticky bottom nav. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#576775; --line:#d3dbe2;
  --accent:#0d5c8f; --accent-ink:#ffffff; --ok:#17744a; --ok-bg:#e1f3e9; --bad:#b3261e; --bad-bg:#fbe5e3; --peek:#8a6a12; --peek-bg:#f8efd2;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e5ecf2; --muted:#94a4b2; --line:#2a3743;
  --accent:#62b6ea; --accent-ink:#08141d; --ok:#4cc38a; --ok-bg:#12301f; --bad:#ff8f86; --bad-bg:#3b1917; --peek:#e3c15d; --peek-bg:#33290c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e5ecf2; --muted:#94a4b2; --line:#2a3743;
  --accent:#62b6ea; --accent-ink:#08141d; --ok:#4cc38a; --ok-bg:#12301f; --bad:#ff8f86; --bad-bg:#3b1917; --peek:#e3c15d; --peek-bg:#33290c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) 80px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.02em}
.stats{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
select,input[type=search]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.tag{padding:1px 8px;border:1px solid var(--line);border-radius:4px}
.tag.w{color:var(--bad);border-color:var(--bad)}
.q{font-size:1.08rem;line-height:1.55;font-weight:500;margin:0;text-wrap:pretty;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;line-height:1.5;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{font-family:var(--mono);font-size:.85rem;color:var(--muted);flex:none;min-width:2.1em;padding-top:2px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)} .opt.ok .n{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)} .opt.bad .n{color:var(--bad)}
.opt .mark{margin-left:auto;flex:none;font-size:.8rem;font-weight:700;padding-left:8px}
.opt.ok .mark{color:var(--ok)} .opt.bad .mark{color:var(--bad)}
.result{border-radius:8px;padding:8px 12px;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:.95rem}
.result.ok{background:var(--ok-bg);color:var(--ok)} .result.bad{background:var(--bad-bg);color:var(--bad)} .result.peek{background:var(--peek-bg);color:var(--peek)}
.result strong{font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;
  color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
details.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.map summary{cursor:pointer;font-size:.9rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin-top:12px}
.cell{font-family:var(--mono);font-size:.74rem;font-variant-numeric:tabular-nums;padding:6px 0;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cell.c{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.w{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bottom div{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center}
nav.bottom .btn{flex:1;justify-content:center}
nav.bottom .pos{font-family:var(--mono);font-size:.82rem;color:var(--muted);flex:none;min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted)}
details.log{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.log summary{cursor:pointer;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=password]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
input[type=password]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ol.steps{margin:0;padding-left:1.3em;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
ol.steps a{color:var(--accent)}
.hint.err{color:var(--bad)}
details.log summary b{color:var(--ink);font-weight:700}
.logbody{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--mono);font-size:1.1rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.tw{overflow-x:auto}
table.week{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
table.week th,table.week td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.week thead th{font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.06em}
table.week tbody th{font-weight:500}
table.week th:nth-child(n+3),table.week td:nth-child(n+3){text-align:right}
table.week tr.today{background:var(--bg)}
.tcell{display:flex;flex-direction:column;gap:3px;min-width:96px}
.wbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--accent)}
[hidden]{display:none!important}
.rvbar{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:5px 12px;font-size:.88rem;font-variant-numeric:tabular-nums}
.rvbar b{color:var(--accent)}
.rvbar .btn{padding:4px 12px;font-size:.85rem}
details.flt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
details.flt summary{cursor:pointer;font-size:.86rem;color:var(--muted);line-height:1.8}
details.flt .filters{margin:6px 0 8px}
@media (max-width:480px){.card{padding:10px 12px 12px}.q{font-size:1.02rem}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>輻防員刷題</h1>
    <div class="stats" id="stats"></div>
  </header>
  <div class="bar" id="bar" aria-hidden="true"><i class="c"></i><i class="w"></i></div>


  <details class="flt" id="fltBox"><summary id="fltSum">篩選</summary>
  <div class="filters">
    <label class="f" for="fSess">梯次
      <select id="fSess"></select></label>
    <label class="f" for="fStat">狀態
      <select id="fStat">
        <option value="all">全部</option>
        <option value="new">未作答</option>
        <option value="wrong">錯題本（答錯過）</option>
        <option value="last-wrong">目前仍錯</option>
        <option value="review">錯題複習（答錯率高→低）</option>
      </select></label>
    <label class="f" for="fOrd">順序
      <select id="fOrd"><option value="seq">依題號</option><option value="rnd">隨機</option></select></label>
    <label class="f" id="rvNWrap" for="rvN" hidden>每輪題數
      <select id="rvN"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="15">15 題</option><option value="20">20 題</option><option value="25">25 題</option><option value="30">30 題</option><option value="35">35 題</option><option value="40">40 題</option><option value="45">45 題</option><option value="50">50 題</option><option value="55">55 題</option><option value="60">60 題</option><option value="65">65 題</option><option value="70">70 題</option><option value="75">75 題</option><option value="80">80 題</option><option value="85">85 題</option><option value="90">90 題</option><option value="95">95 題</option><option value="100">100 題</option><option value="all">全部錯題</option></select></label>
    <label class="f" for="fQ">關鍵字
      <input id="fQ" type="search" placeholder="例如：豁免、運送"></label>
  </div>
  </details>

  <div class="rvbar" id="rvBar" hidden><span id="rvTxt"></span><button class="btn" id="rvSumBtn" type="button">本輪成績</button></div>

  <main id="main"></main>

  <details class="map"><summary id="mapSum">題目地圖</summary><div class="grid" id="grid"></div></details>
  <details class="log" id="syncBox"><summary id="syncSum"></summary><div class="logbody" id="syncBody"></div></details>
  <details class="log" id="logBox"><summary id="logSum"></summary><div class="logbody" id="logBody"></div></details>
  <p class="hint">快速鍵：1～4 作答，← → 換題，Space 顯示答案。作答與學習紀錄只存在這個瀏覽器。</p>
  <div><button class="btn" id="reset" type="button">清除作答紀錄</button> <span class="hint" id="resetMsg"></span></div>
</div>

<nav class="bottom"><div>
  <button class="btn" id="prev" type="button">‹ 上一題</button>
  <span class="pos" id="pos"></span>
  <button class="btn primary" id="next" type="button">下一題 ›</button>
</div></nav>

<script>
const DATA = [{"n": 1, "q": "放射性物質之生產與其設施之建造及可發生游離輻射設備之製造，非經向主管機關申請審查，發給許可證，不得為之。此許可證之有效期間最長為多久？", "o": ["6 個月", "3 年", "5 年", "10 年"], "a": 3, "s": "115年(1)"}, {"n": 2, "q": "動力用核子反應器每一機組應至少配置輻射防護師 X 名，輻射防護員 Y 名，設施內每一輪值應至少有一名輻射防護員當值，其中 X、Y 分別為何？", "o": ["2、5", "1、2", "1、1", "2、3"], "a": 0, "s": "115年(1)"}, {"n": 3, "q": "影響既存輻射源與受曝露人間之曝露途徑，以減少個人或集體曝露所採取之措施，稱為下列何者？", "o": ["曝露", "輻射作業", "干預", "合理抑低"], "a": 2, "s": "115年(1)"}, {"n": 4, "q": "依放射性物質安全運送規則之規定，下列敘述何者正確？", "o": ["載運放射性物質的車輛，其核定載人座位之輻射強度每小時不得超過 0.2 毫西弗。", "運送放射性物質之專用車輛，在其車輛的外側表面任一點的輻射劑量率每小時不得 超過 0.2 毫西弗。", "載運放射性物質之車輛為非專用者，其運送指數不得超過 20。", "工作人員於運送放射性物質時，所接受之年有效劑量可能大於 6 毫西弗時，應執行 個別人員偵測及醫務監護。"], "a": 3, "s": "115年(1)"}, {"n": 5, "q": "下列哪一種劑量未考慮輻射的生物效應？", "o": ["等效劑量", "等價劑量", "有效劑量", "器官劑量"], "a": 3, "s": "115年(1)"}, {"n": 6, "q": "依據輻射工作人員特別健康檢查項目之規定，當輻射工作人員懷疑遭受中子曝露時，應額外接受下列何項檢查？", "o": ["血中鈉-24 含量分析", "全身計測", "血液學檢查", "尿液常規檢查"], "a": 0, "s": "115年(1)"}, {"n": 7, "q": "設施經營者應設置七人以上輻射防護管理委員會，法規規定之委員組成不包含下列哪一種類人員？", "o": ["設施經營負責人", "輻射防護業務單位之業務主管", "相關部門主管", "主管機關人員"], "a": 3, "s": "115年(1)"}, {"n": 8, "q": "密封放射性物質按其對人體健康及環境之潛在危害程度分為幾類，其危險性如何區分？", "o": ["5，數值愈小愈危險", "5，數值愈大愈危險", "7，數值愈小愈危險", "7，數值愈大愈危險"], "a": 0, "s": "115年(1)"}, {"n": 9, "q": "下列何者用於輻射防護評估目的，由國際放射防護委員會提出，代表人體與生理學特性之總合？", "o": ["標準人", "參考人", "假體", "自然人"], "a": 1, "s": "115年(1)"}, {"n": 10, "q": "申請可發生游離輻射設備之製造許可者，應於預定製造日期多少個月前填具申請書並檢附相關文件資料向主管機關申請審查？", "o": ["1", "2", "3", "6"], "a": 3, "s": "115年(1)"}, {"n": 11, "q": "設施依規定必須實施環境輻射監測，則在設施預定運轉之 X 年前，設施經營者應提報環境輻射監測計畫，並進行至少 Y 年以上環境輻射背景調查。其中 X 與 Y 分別為：", "o": ["5、4", "4、3", "3、2", "2、1"], "a": 2, "s": "115年(1)"}, {"n": 12, "q": "因外力不可抗拒因素，致輻射作業場所之屏蔽或防止輻射洩漏設施損壞，而未於多久期限以內修復者，其經營者必須向主管機關申請核准停止使用或運轉？", "o": ["1 個月", "3 個月", "6 個月", "1 年"], "a": 2, "s": "115年(1)"}, {"n": 13, "q": "依輻射工作場所管理與場所外環境輻射監測作業準則之規定，下列哪一輻射工作場所之區域需設置實體圍籬？", "o": ["監測區", "環境區", "警示區", "管制區"], "a": 3, "s": "115年(1)"}, {"n": 14, "q": "依商品輻射限量標準之規定，飲用水對全身每年之有效劑量限值為多少微西弗？", "o": ["100", "50", "40", "10"], "a": 2, "s": "115年(1)"}, {"n": 15, "q": "輻射作業造成一般人之年有效劑量不得超過多少毫西弗？", "o": ["0.5", "1", "2", "5"], "a": 1, "s": "115年(1)"}, {"n": 16, "q": "依天然放射性物質管理辦法之規定，含天然放射性物質之建材，其表面 0.1 公尺處之輻射劑量率，於每小時多少微西弗以下者，其使用範圍不受限制？", "o": ["0.2", "0.5", "1", "10"], "a": 0, "s": "115年(1)"}, {"n": 17, "q": "輻射工作人員職業曝露之劑量限度，眼球水晶體之等價劑量於一年內不得超過多少毫西 弗？", "o": ["100", "150", "200", "500"], "a": 1, "s": "115年(1)"}, {"n": 18, "q": "若載運放射性物資之車輛為非專用者，其運送指數不得超過多少？", "o": ["1", "3", "10", "30"], "a": 2, "s": "115年(1)"}, {"n": 19, "q": "有關設施經營者實施密封放射性物質之擦拭測試，下列何者敘述錯誤？", "o": ["氣態密封放射性物質每半年實施一次", "液態閃爍計數器中供校正用密封放射性物質得免實施擦拭測試", "放射性核種為鐳者，應包含氡氣洩漏測試", "毒氣偵檢器中所含之鋂二四一為每三年實施一次"], "a": 0, "s": "115年(1)"}, {"n": 20, "q": "依據法規，下列哪一項設備或物質在正常操作情況下，距其任何可接近之表面 0.1 公尺處之劑量率每小時不超過 1 微西弗者，免依游離輻射防護法規定管制？", "o": ["公稱電壓不超過三萬伏特之可發生游離輻射設備", "公稱電壓超過三萬伏特之可發生游離輻射設備", "公稱電壓不超過五萬伏特之可發生游離輻射設備", "無相關規定"], "a": 0, "s": "115年(1)"}, {"n": 21, "q": "依據嚴重污染環境輻射標準規定，嚴重污染環境的定義是指輻射作業使場所外一般人體外曝露之劑量，於一小時內超過多少毫西弗？", "o": ["0.1", "0.2", "0.05", "0.005"], "a": 1, "s": "115年(1)"}, {"n": 22, "q": "依輻射防護服務相關業務管理辦法之規定，動物用 X 光機之安裝或維修，屬於下列何種業務範圍？", "o": ["輻射防護偵測業務", "可發生游離輻射設備銷售服務業務", "輻射防護訓練業務", "人員輻射劑量評定業務"], "a": 1, "s": "115年(1)"}, {"n": 23, "q": "設施經營者應確保其輻射作業對輻射工作場所以外地區之事項，不超過游離輻射防護安全標準之規定，下列何者在游離輻射防護安全標準中沒有規定？", "o": ["輻射強度", "水中及污水下水道中所含放射性物質之濃度", "空氣中所含放射性物質之濃度", "土壤中所含放射性物質之濃度"], "a": 3, "s": "115年(1)"}, {"n": 24, "q": "民國 115 年取得輻射防護員級認可證書者其證書期限至民國幾年？且申請換發時需累積輻射防護相關繼續教育課程積分至少多少點以上？", "o": ["120 年、72 點", "120 年、96 點", "121 年、72 點", "121 年、96 點"], "a": 2, "s": "115年(1)"}, {"n": 25, "q": "輻射防護人員申請認可所需之輻射防護工作訓練，於下列何單位接受訓練將不被認可？", "o": ["使用豁免管制輻射源之設施經營者", "領有主管機關核發許可證輻射源之設施經營者", "領有主管機關同意登記輻射源之設施經營者", "經主管機關認可從事輻射防護服務相關業務者"], "a": 0, "s": "115年(1)"}, {"n": 26, "q": "雇主依規定對在職輻射工作人員定期實施之教育訓練，相關資料應記錄並保存至少多少 年？", "o": ["3", "5", "10", "30"], "a": 2, "s": "115年(1)"}, {"n": 27, "q": "可發生游離輻射設備及放射性物質之工作場所輻射安全評估，為下列何者輻射防護服務業務的工作項目？", "o": ["人員輻射劑量評定業務", "輻射防護偵測業務", "放射性物質或可發生游離輻射設備銷售服務業務", "輻射防護訓練業務"], "a": 1, "s": "115年(1)"}, {"n": 28, "q": "參考人在一年內攝入某放射性核種，導致五十毫西弗約定有效劑量之 // mineRec / mineLog＝這台裝置自己的紀錄；othersRec / othersLog＝從雲端讀到的其他裝置紀錄；rec / log＝兩者加總後給畫面用

const OKEY = 'rp-sync-others-v1';

let rec = {};
function mergeRec(m, o){
  if (!m) return o ? {c: o.c || 0, w: o.w || 0, last: o.last || null, t: o.t || 0} : null;
  if (!o) return {c: m.c || 0, w: m.w || 0, last: m.last || null, t: m.t || 0};
  const mineNewer = (m.t || 0) >= (o.t || 0);
  return {c: (m.c || 0) + (o.c || 0), w: (m.w || 0) + (o.w || 0), last: (mineNewer ? m.last : o.last) || null, t: Math.max(m.t || 0, o.t || 0)};
}
function recompute(){
  const r = {};
  new Set([...Object.keys(mineRec), ...Object.keys(othersRec)]).forEach(id => { r[id] = mergeRec(mineRec[id], othersRec[id]); });
  rec = r;
}
recompute();

function recomputeLog(){
  const l = {};
  [mineLog, othersLog].forEach(src => Object.keys(src).forEach(k => {
    const t = l[k] || (l[k] = ZERO()), x = src[k];
    t.s += x.s || 0; t.a += x.a || 0; t.w += x.w || 0; t.v += x.v || 0;
  }));
  log = l;
}

function addLog(k, f, n){

}
function saveLog(quiet){
  try {
    // 同時開了兩個分頁時，各欄位取較大值合併，避免互相覆蓋
    const o = JSON.parse(localStorage.getItem(LKEY) || '{}') || {};
    Object.keys(o).forEach(k => {
      const a = mineLog[k], b = o[k];
      mineLog[k] = a ? {s: Math.max(a.s, b.s), a: Math.max(a.a, b.a), w: Math.max(a.w, b.w), v: Math.max(a.v, b.v)} : b;

  if (sec < 60) return sec > 0 ? '不到 1 分' : '0 分';

  const now = new Date(), off = (now.getDay() + 6) % 7;

    const r = rec[d.id];
    if (st === 'new' && r) return false;
    if (st === 'wrong' && !(r && r.w > 0)) return false;
    if (st === 'last-wrong' && !(r && r.last === 'w')) return false;
    if (kw && !(d.q + d.o.join(' ')).toLowerCase().includes(kw)) return false;
    return true;
  });
  if ($('fOrd').value === 'rnd') {
    let x = (seed * 9301 + 49297) % 233280;
    deck = deck.map(d => ({d, k: (x = (x * 9301 + 49297) % 233280)})).sort((a, b) => a.k - b.k).map(o => o.d);
  }
  const i = keepId ? deck.findIndex(d => d.id === keepId) : -1;
  cur = i >= 0 ? i : 0; picked = null; peeked = false;
  render();
}

// ---- 錯題複習：把答錯過的題依答錯率排序，分輪複習，直到全部錯題都複習過 ----
let rvList = null, rvOff = 0, rvRes = {}, rvSum = false, rvSig = '', rvS = 'all', rvKw = '';
function rvPer(){ const v = $('rvN').value; return v === 'all' ? Infinity : +v; }
function rvRate(d){ const r = rec[d.id]; return r.w / (r.c + r.w); }
function rvBuild(s, kw){
  rvS = s; rvKw = kw;
  rvList = DATA.filter(d => {
    const r = rec[d.id];
    if (!(r && r.w > 0)) return false;
    if (s !== 'all' && d.s !== s) return false;
    if (kw && !(d.q + d.o.join(' ')).toLowerCase().includes(kw)) return false;
    return true;
  }).sort((a, b) => rvRate(b) - rvRate(a) || rec[b.id].w - rec[a.id].w || a.ix - b.ix).map(d => d.id);
  rvOff = 0; rvRes = {}; rvSum = false;
}
function rvChunk(){ return rvList.slice(rvOff, rvOff + rvPer()).map(id => byId.get(id)); }
function renderRv(){
  const on = $('fStat').value === 'review';
  $('rvBar').hidden = !on;
  if (!on || !rvList) return;
  const n = deck.length, done = deck.filter(d => d.id in rvRes).length, tot = rvList.length, per = rvPer();
  const rounds = per === Infinity ? 1 : Math.max(1, Math.ceil(tot / per));
  const round = per === Infinity ? 1 : Math.floor(rvOff / per) + 1;
  const complete = n > 0 && done === n;
  $('rvTxt').innerHTML = '<b>錯題複習</b> 第 ' + round + '/' + rounds + ' 輪 · 本輪 ' + done + '/' + n + ' 題 · 錯題共 ' + tot + ' 題';
  const btn = $('rvSumBtn');
  btn.textContent = complete ? '看本輪成績 ›' : '本輪成績';
  btn.className = 'btn' + (complete ? ' primary' : '');
  btn.disabled = n === 0;
}
function rvSummaryView(m){
  const n = deck.length, ok = deck.filter(d => rvRes[d.id] === true).length, done = deck.filter(d => d.id in rvRes).length;
  const left = rvList.length - (rvOff + n);
  m.innerHTML = '<section class="card" aria-live="polite"><div class="meta"><span>本輪成績</span></div>' +
    '<p class="q">答對 ' + ok + ' / ' + n + ' 題' + (done < n ? '（還有 ' + (n - done) + ' 題沒作答）' : '') + '</p>' +
    '<div class="actions"><button class="btn primary" id="rvNext" type="button">' +
    (left > 0 ? '下一輪（還剩 ' + left + ' 題）' : '全部錯題都複習過了，重新開始') + '</button>' +
    '<button class="btn" id="rvBack" type="button">回看本輪題目</button>' +
    '<button class="btn" id="rvAll" type="button">回到全部題目</button></div></section>';
  $('pos').textContent = '本輪成績';
  $('prev').disabled = $('next').disabled = false;
  $('rvNext').onclick = () => {
    if (left > 0) { rvOff += n; rvRes = {}; rvSum = false; } else rvBuild(rvS, rvKw);
    buildDeck(); window.scrollTo({top: 0});
  };
  $('rvBack').onclick = () => { rvSum = false; cur = 0; picked = null; peeked = false; render(); };
  $('rvAll').onclick = () => { $('fStat').value = 'all'; buildDeck(); window.scrollTo({top: 0}); };
}
$('rvSumBtn').onclick = () => { rvSum = true; render(); };

function prompt_(d, choice){
  const L = i => '(' + (i + 1) + ')';
  let t = '我正在準備台灣的輻射防護員考試。請針對下面這一題，逐一說明每個錯誤選項為什麼錯（請指出相關法規條文名稱與規定內容，或背後的輻射防護原理），再說明正確答案為什麼對。若選項中的數值有記憶訣竅，也請一併提供。\n\n';
  t += '【' + d.s + ' 第' + d.n + '題】\n' + d.q + '\n' + d.o.map((o, i) => L(i) + ' ' + o).join('\n');
  t += '\n\n正確答案：' + L(d.a);
  if (choice != null && choice !== d.a) t += '\n我選的是：' + L(choice);
  return t;
}
function gpt(d, choice){ return 'https://chatgpt.com/?q=' + encodeURIComponent(prompt_(d, choice)); }

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  renderStats(); renderGrid(); renderLog(); renderFlt(); renderRv();
  const m = $('main');
  if ($('fStat').value === 'review' && rvSum && deck.length) { rvSummaryView(m); return; }
  if (!deck.length) {
    m.innerHTML = '<div class="card empty">這個條件下沒有題目。可以換一個梯次、狀態或關鍵字。</div>';
    $('pos').textContent = '0 / 0'; $('prev').disabled = $('next').disabled = true; return;
  }
  $('prev').disabled = $('next').disabled = false;
  const d = deck[cur], r = rec[d.id], answered = picked != null, show = answered || peeked;
  $('pos').textContent = (cur + 1) + ' / ' + deck.length;
  let h = '<section class="card" aria-live="polite"><div class="meta"><span>' + esc(d.s) + ' · 第 ' + d.n + ' 題</span><span>' +
    (r && r.w ? '<span class="tag w">答錯 ' + r.w + ' 次</span> ' : '') + (r && r.c ? '<span class="tag">答對 ' + r.c + ' 次</span>' : '') + '</span></div>';
  h += '<p class="q">' + esc(d.q) + '</p><ul class="opts">';
  d.o.forEach((o, i) => {
    let cls = '', mark = '';
    if (show && i === d.a) { cls = 'ok'; mark = '正確答案'; }
    if (answered && i === picked && i !== d.a) { cls = 'bad'; mark = '你的選擇'; }
    h += '<li><button class="opt ' + cls + '" data-i="' + i + '" type="button"' + (show ? ' disabled' : '') + '><span class="n">(' + (i + 1) + ')</span><span>' + esc(o) + '</span>' + (mark ? '<span class="mark">' + mark + '</span>' : '') + '</button></li>';
  });
  h += '</ul>';
  if (show) {
    const ok = answered && picked === d.a;
    h += '<div class="result ' + (answered ? (ok ? 'ok' : 'bad') : 'peek') + '"><strong>' +
      (answered ? (ok ? '答對了' : '答錯了，正確答案是 (' + (d.a + 1) + ')') : '正確答案是 (' + (d.a + 1) + ')，這題不計入作答紀錄') + '</strong>' +
      '<div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="' + gpt(d, picked) + '">用 ChatGPT 查詢錯誤選項 ↗</a>' +
      '<button class="btn" id="copyP" type="button">複製題目提示詞</button></div></div>';
  } else {
    h += '<div class="actions"><button class="btn" id="peek" type="button">顯示答案</button></div>';
  }
  h += '</section>';
  m.innerHTML = h;
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  const pk = $('peek'); if (pk) pk.onclick = () => { peeked = true; render(); };
  const cp = $('copyP'); if (cp) cp.onclick = () => {
    const t = prompt_(d, picked);
    const done = () => { cp.textContent = '已複製'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => { cp.textContent = '請改用 ChatGPT 連結'; });
    else cp.textContent = '請改用 ChatGPT 連結';
  };
}
function answer(i){
  if (!deck.length || picked != null || peeked || rvSum) return;
  const d = deck[cur]; picked = i;
  const wasWrong = !!(rec[d.id] && rec[d.id].w > 0);
  const m = mineRec[d.id] || (mineRec[d.id] = {c: 0, w: 0, last: null, t: 0});
  if (i === d.a) { m.c++; m.last = 'c'; } else { m.w++; m.last = 'w'; }
  m.t = Date.now();
  rec[d.id] = mergeRec(m, othersRec[d.id]);
  if ($('fStat').value === 'review') rvRes[d.id] = (i === d.a);
  logAnswer(i === d.a, wasWrong); save(); render();
}
function go(n){
  if (!deck.length) return;
  cur = (cur + n + deck.length) % deck.length; picked = null; peeked = false; rvSum = false; render();
  window.scrollTo({top: 0});
}
function renderStats(){
  const done = DATA.filter(d => rec[d.id]).length, c = DATA.filter(d => status(d) === 'c').length, w = DATA.filter(d => status(d) === 'w').length;
  $('stats').innerHTML = '已作答 <b>' + done + '</b>/' + DATA.length + ' · 目前答對 <b>' + c + '</b> · 目前仍錯 <b>' + w + '</b>';
  const bar = $('bar').children; bar[0].style.width = (c / DATA.length * 100) + '%'; bar[1].style.width = (w / DATA.length * 100) + '%';
}
function renderGrid(){
  $('mapSum').textContent = '題目地圖（目前篩選 ' + deck.length + ' 題，綠＝答對、紅＝仍錯）';
  $('grid').innerHTML = deck.map((d, i) => '<button class="cell ' + (status(d) || '') + (i === cur ? ' cur' : '') + '" data-i="' + i + '" type="button" title="' + esc(d.s) + ' 第' + d.n + '題">' + (i + 1) + '</button>').join('');
  $('grid').querySelectorAll('.cell').forEach(b => b.onclick = () => { cur = +b.dataset.i; picked = null; peeked = false; rvSum = false; render(); window.scrollTo({top: 0}); });
}

['fSess', 'fStat', 'rvN'].forEach(id => $(id).onchange = () => buildDeck());
$('fOrd').onchange = () => { seed = Math.floor(Math.random() * 1e6); buildDeck(); };
$('fQ').oninput = () => buildDeck();
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
let armed = false;
$('reset').onclick = () => {
  if (!armed) { armed = true; $('resetMsg').textContent = S.token ? '再按一次確認，雲端與其他裝置的紀錄也會一起清除' : '再按一次確認清除全部紀錄'; setTimeout(() => { armed = false; $('resetMsg').textContent = ''; }, 5000); return; }
  mineRec = {}; mineLog = {}; othersRec = {}; othersLog = {}; recompute(); recomputeLog(); persistOthers(); localSaveMine();
  if (S.token) { S.epoch = Date.now(); S.resetPending = true; saveS(); }
  rvList = null; save(); armed = false; $('resetMsg').textContent = S.token ? '已清除，正在同步到其他裝置' : '已清除'; buildDeck();
};
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key >= '1' && e.key <= '4') answer(+e.key - 1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ' && picked == null && !peeked && !rvSum && deck.length) { e.preventDefault(); peeked = true; render(); }
});

// ---- 雲端同步：把這台裝置的紀錄存進你自己 GitHub 帳號的私人 Gist，各裝置各存一份再加總 ----
const SKEY = 'rp-sync-v1', GFILE = 'fufang-quiz-progress.json';
let S = {};
try { S = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; } catch (e) { S = {}; }
if (!S.device) S.device = Math.random().toString(36).slice(2, 10);
function saveS(){ try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} }
saveS();
function persistOthers(){ try { localStorage.setItem(OKEY, JSON.stringify({rec: othersRec, log: othersLog})); } catch (e) {} }
function localSaveMine(){ try { localStorage.setItem(KEY, JSON.stringify(mineRec)); localStorage.setItem(LKEY, JSON.stringify(mineLog)); } catch (e) {} }
let dirty = false, syncing = false, syncAgain = false, pushT = 0;
function pushSoon(){ dirty = true; if (!S.token) return; clearTimeout(pushT); pushT = setTimeout(() => sync(), 5000); }
function devName(){
  const u = navigator.userAgent;
  return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '裝置';
}
async function gh(path, opt){
  opt = opt || {};
  const r = await fetch('https://api.github.com' + path, {
    method: opt.method || 'GET', cache: 'no-store', body: opt.body,
    headers: Object.assign({Authorization: 'Bearer ' + S.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, opt.body ? {'Content-Type': 'application/json'} : {})
  });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function findGist(){
  for (let p = 1; p <= 5; p++) {
    const list = await gh('/gists?per_page=100&page=' + p);
    const hit = list.filter(g => g.files && g.files[GFILE]).sort((a, b) => a.created_at < b.created_at ? -1 : 1)[0];
    if (hit) return hit.id;
    if (list.length < 100) break;
  }
  return null;
}
async function readRemote(){
  const g = await gh('/gists/' + S.gist);
  const f = g.files && g.files[GFILE];
  if (!f) { const e = new Error('missing'); e.status = 404; throw e; }
  let txt = f.content;
  if (f.truncated) txt = await (await fetch(f.raw_url, {cache: 'no-store'})).text();
  try { const o = JSON.parse(txt); if (o && o.devices) return o; } catch (e) {}
  return {v: 1, epoch: 0, devices: {}};
}
function aggregate(remote){
  const r = {}, l = {};
  Object.keys(remote.devices).forEach(id => {
    if (id === S.device) return;
    const dv = remote.devices[id] || {};
    Object.keys(dv.rec || {}).forEach(q => { r[q] = mergeRec(r[q], dv.rec[q]); });
    Object.keys(dv.log || {}).forEach(k => {
      const t = l[k] || (l[k] = ZERO()), x = dv.log[k];
      t.s += x.s || 0; t.a += x.a || 0; t.w += x.w || 0; t.v += x.v || 0;
    });
  });
  othersRec = r; othersLog = l;
}
async function sync(){
  if (!S.token) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; clearTimeout(pushT); dirty = false; S.err = '';
  try {
    if (!S.gist) {
      S.gist = await findGist();
      if (!S.gist) {
        const g = await gh('/gists', {method: 'POST', body: JSON.stringify({description: '輻防員刷題進度（自動產生，請勿手動修改）', public: false,
          files: {[GFILE]: {content: JSON.stringify({v: 1, epoch: S.epoch || 0, devices: {}})}}})});
        S.gist = g.id;
      }
      saveS();
    }
    const remote = await readRemote();
    let force = false;
    if (S.resetPending) { remote.epoch = S.epoch; remote.devices = {}; S.resetPending = false; force = true; }
    else if (S.epoch == null) S.epoch = remote.epoch || 0;
    else if ((remote.epoch || 0) > S.epoch) { mineRec = {}; mineLog = {}; S.epoch = remote.epoch; localSaveMine(); }
    aggregate(remote);
    const sig = o => JSON.stringify([o && o.name, o && o.rec, o && o.log]);
    const mine = {name: devName(), rec: mineRec, log: mineLog};
    if (force || sig(remote.devices[S.device]) !== sig(mine) || remote.epoch !== S.epoch) {
      remote.epoch = S.epoch;
      remote.devices[S.device] = {name: mine.name, rec: mineRec, log: mineLog, upd: Date.now()};
      await gh('/gists/' + S.gist, {method: 'PATCH', body: JSON.stringify({files: {[GFILE]: {content: JSON.stringify(remote)}}})});
    }
    S.last = Date.now(); S.n = Object.keys(remote.devices).length; saveS();
    persistOthers(); recompute(); recomputeLog();
    afterSync();
  } catch (e) {
    if (e.status === 401) S.err = '權杖無效或已過期，請重新連結';
    else if (e.status === 403 || e.status === 429) S.err = 'GitHub 暫時拒絕連線（權限不足或次數過多），稍後會再試';
    else if (e.status === 404) { S.gist = ''; S.err = '找不到雲端紀錄，下次同步會重新建立'; }
    else S.err = '目前連不上網路，連線後會自動同步';
    S.errAt = Date.now(); saveS(); renderSync();
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; if (!S.err) sync(); }
  }
}
function afterSync(){
  renderSync();
  if (picked == null && !peeked) render(); else { renderStats(); renderGrid(); renderLog(); }
}
function hm(ts){ const d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function renderSync(){
  const on = !!S.token;
  $('syncSum').innerHTML = '<b>雲端同步</b> ' + (!on ? '未連結（換裝置時紀錄不會跟著走）' : S.err ? '同步失敗' : S.last ? '已同步 ' + hm(S.last) + ' · ' + (S.n || 1) + ' 台裝置' : '同步中…');
  const st = $('syncStat');
  if (st) { st.textContent = S.err || (S.last ? '最後同步 ' + hm(S.last) + '，目前雲端有 ' + (S.n || 1) + ' 台裝置的紀錄。' : '同步中…'); st.className = 'hint' + (S.err ? ' err' : ''); }
}
let offArmed = false;
function buildSyncBody(){
  const b = $('syncBody');
  if (!S.token) {
    b.innerHTML = '<p class="hint">把作答與學習紀錄存到你自己 GitHub 帳號的私人 Gist（不會公開列出，只有知道網址的人才看得到）。每台裝置貼上同一組權杖，紀錄就會自動合併。</p>' +
      '<ol class="steps"><li>打開 <a href="https://github.com/settings/tokens/new?scopes=gist&description=fufang-quiz" target="_blank" rel="noopener">建立權杖頁面</a>，確認只勾選 gist，Expiration 選 No expiration，按最下方 Generate token。</li>' +
      '<li>複製 ghp_ 開頭的那串文字，貼到下面。</li></ol>' +
      '<input type="password" id="syncTok" placeholder="貼上 ghp_ 開頭的權杖" autocomplete="off" aria-label="GitHub 權杖">' +
      '<div class="actions"><button class="btn primary" id="syncGo" type="button">連結並同步</button></div><p class="hint" id="syncErr"></p>' +
      '<p class="hint">權杖等同密碼，只會存在這台裝置的瀏覽器裡。它只有 gist 權限，不能動你的程式碼倉庫。</p>';
    $('syncGo').onclick = async () => {
      const tok = $('syncTok').value.trim(), err = $('syncErr');
      if (!/^(ghp_|github_pat_)/.test(tok)) { err.textContent = '這看起來不是權杖，請貼上 ghp_ 開頭的文字。'; err.className = 'hint err'; return; }
      err.textContent = '連線中…'; err.className = 'hint';
      S.token = tok; S.gist = ''; S.epoch = null; S.resetPending = false; S.last = 0; S.err = ''; saveS();
      await sync();
      if (S.err) { const m = S.err; S.token = ''; saveS(); err.textContent = m; err.className = 'hint err'; renderSync(); return; }
      buildSyncBody(); renderSync();
    };
  } else {
    b.innerHTML = '<p class="hint" id="syncStat"></p>' +
      '<div class="actions"><button class="btn primary" id="syncNow" type="button">立即同步</button><button class="btn" id="syncOff" type="button">中斷連結</button></div>' +
      '<p class="hint" id="offMsg"></p>' +
      '<p class="hint">在其他裝置打開這個網頁，貼上同一組權杖即可。作答次數與學習時間會把各裝置加總。</p>';
    $('syncNow').onclick = () => { $('offMsg').textContent = ''; sync(); };
    $('syncOff').onclick = () => {
      const m = $('offMsg');
      if (!offArmed) { offArmed = true; m.textContent = '再按一次確認。這台裝置會停止同步，只保留自己的紀錄，雲端資料不會被刪除。'; setTimeout(() => { offArmed = false; m.textContent = ''; }, 6000); return; }
      offArmed = false; S.token = ''; S.gist = ''; S.epoch = null; S.last = 0; S.err = ''; saveS();
      othersRec = {}; othersLog = {}; persistOthers(); recompute(); recomputeLog();
      buildSyncBody(); renderSync(); render();
    };
  }
}
setInterval(() => {
  if (!S.token || document.visibilityState !== 'visible') return;
  if (dirty || Date.now() - (S.last || 0) > 300000) sync();
}, 60000);

buildDeck();
buildSyncBody(); renderSync(); if (S.token) sync();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
